name: DigiGuru Weekly Content Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: write

concurrency:
  group: digiguru-content-pipeline
  cancel-in-progress: false

jobs:
  produce-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          npm install --prefix "$OS_DIR" --omit=dev
      - name: Generate platform native content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          node "$OS_DIR/src/generate-content.mjs"
      - name: Validate content
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          node "$OS_DIR/src/validate.mjs"
      - name: Render video assets
        env:
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
          MAX_RENDERS_PER_RUN: ${{ secrets.MAX_RENDERS_PER_RUN }}
          RENDER_ALL_PLATFORMS: ${{ secrets.RENDER_ALL_PLATFORMS }}
          ENABLE_VOICEOVER: ${{ secrets.ENABLE_VOICEOVER }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          node "$OS_DIR/src/render-video.mjs"
      - name: Create distribution queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNELS_JSON: ${{ secrets.BUFFER_CHANNELS_JSON }}
          ENABLE_AUTO_PUBLISH: ${{ secrets.ENABLE_AUTO_PUBLISH }}
          CONTENT_PUBLISH_MODE: ${{ secrets.CONTENT_PUBLISH_MODE }}
          MAX_SOCIAL_POSTS_PER_RUN: ${{ secrets.MAX_SOCIAL_POSTS_PER_RUN }}
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          node "$OS_DIR/src/publish.mjs"
      - name: Commit content, rendered links and queue results
        run: |
          git config user.name 'DigiGuru Content OS'
          git config user.email 'content-os@digiguru.local'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(content-os): generate weekly content package'
            git push
          fi
