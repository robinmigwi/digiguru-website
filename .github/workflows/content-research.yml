name: DigiGuru Content Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: digiguru-content-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run research agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          node "$OS_DIR/src/research.mjs"
      - name: Commit research snapshot
        run: |
          git config user.name 'DigiGuru Content OS'
          git config user.email 'content-os@digiguru.local'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(content-os): add daily research snapshot'
            git push
          fi
