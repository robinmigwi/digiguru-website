name: DigiGuru Analytics and Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: digiguru-content-analytics
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect published post metrics
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNELS_JSON: ${{ secrets.BUFFER_CHANNELS_JSON }}
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          node "$OS_DIR/src/analytics.mjs"
      - name: Learn from performance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          OS_DIR=.
          if [ -f content-os/package.json ]; then OS_DIR=content-os; fi
          node "$OS_DIR/src/learn.mjs"
      - name: Commit analytics and learning report
        run: |
          git config user.name 'DigiGuru Content OS'
          git config user.email 'content-os@digiguru.local'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(content-os): refresh performance learning'
            git push
          fi
